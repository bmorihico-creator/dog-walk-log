<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>우리집 댕댕이 산책일지</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f6f2ec;
  color: #403a35;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Noto Sans KR",
    sans-serif;
}

button {
  font-family: inherit;
  cursor: pointer;
}

.app {
  max-width: 1100px;
  margin: auto;
  padding: 24px 16px 50px;
}

/* HEADER */

.header {
  padding: 8px 4px 20px;
}

.eyebrow {
  font-size: 12px;
  font-weight: 800;
  color: #a28468;
  letter-spacing: 1px;
  margin-bottom: 7px;
}

h1 {
  margin: 0;
  font-size: 28px;
  letter-spacing: -1.5px;
}

.subtitle {
  margin-top: 7px;
  color: #91867c;
  font-size: 13px;
}

/* NAV */

.nav {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 7px;
  background: #ebe4db;
  padding: 5px;
  border-radius: 17px;
  margin-bottom: 17px;
}

.nav button {
  border: 0;
  background: transparent;
  color: #8d8176;
  padding: 11px 5px;
  border-radius: 13px;
  font-size: 13px;
  font-weight: 700;
}

.nav button.active {
  background: #fffdf9;
  color: #55483d;
  box-shadow: 0 3px 10px rgba(70,50,30,.08);
}

/* COMMON CARD */

.card {
  background: #fffdf9;
  border-radius: 21px;
  box-shadow: 0 5px 20px rgba(70,50,30,.06);
}

/* TODAY */

.date-card {
  padding: 19px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}

.date-label {
  font-size: 11px;
  color: #a69b91;
  font-weight: 700;
  letter-spacing: .7px;
}

.today {
  font-size: 21px;
  font-weight: 850;
  margin-top: 3px;
}

.rate {
  text-align: right;
}

.rate-number {
  font-size: 25px;
  font-weight: 850;
  color: #9c7d5f;
}

.rate-label {
  font-size: 11px;
  color: #aaa098;
}

.section-title {
  font-size: 16px;
  font-weight: 850;
  margin: 22px 3px 10px;
}

.dog-list {
  display: grid;
  gap: 9px;
}

.dog-card {
  background: #fffdf9;
  border-radius: 18px;
  padding: 14px 15px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: 0 3px 13px rgba(70,50,30,.045);
}

.dog-name {
  font-size: 15px;
  font-weight: 800;
}

.status {
  margin-top: 4px;
  font-size: 11px;
  color: #aaa098;
}

.buttons {
  display: flex;
  gap: 6px;
}

.walk-btn {
  border: 0;
  width: 43px;
  height: 38px;
  border-radius: 12px;
  background: #eee9e1;
  color: #82766a;
  font-size: 17px;
  font-weight: 900;
}

.walk-btn.active-yes {
  background: #b79a78;
  color: white;
}

.walk-btn.active-no {
  background: #8f8881;
  color: white;
}

.walk-btn:active {
  transform: scale(.94);
}

/* MONTH */

.month-header {
  padding: 20px;
  margin-bottom: 13px;
}

.month-title {
  font-size: 20px;
  font-weight: 850;
}

.month-summary {
  margin-top: 6px;
  color: #91867c;
  font-size: 12px;
}

.month-table-wrap {
  background: #fffdf9;
  border-radius: 20px;
  box-shadow: 0 5px 20px rgba(70,50,30,.06);
  overflow: auto;
  -webkit-overflow-scrolling: touch;
}

.month-table {
  border-collapse: separate;
  border-spacing: 0;
  min-width: 970px;
  width: max-content;
  font-size: 12px;
}

.month-table th,
.month-table td {
  border-right: 1px solid #eee8df;
  border-bottom: 1px solid #eee8df;
  text-align: center;
  height: 48px;
  padding: 5px;
}

.month-table th {
  background: #f3eee7;
  color: #665a4f;
  font-weight: 850;
  position: sticky;
  top: 0;
  z-index: 2;
}

.month-table th:first-child,
.month-table td:first-child {
  position: sticky;
  left: 0;
  z-index: 3;
  background: #fffdf9;
}

.month-table th:first-child {
  background: #eee7de;
  z-index: 5;
}

.month-table .date-cell {
  min-width: 62px;
  font-weight: 800;
  color: #665a4f;
}

.month-table .dog-head {
  min-width: 64px;
}

.month-table .walk-cell {
  min-width: 64px;
  cursor: pointer;
  user-select: none;
  font-size: 20px;
  font-weight: 900;
  transition: .15s;
}

.month-table .walk-cell:active {
  transform: scale(.9);
}

.month-table .walk-yes {
  color: #a18160;
  background: #fbf7f0;
}

.month-table .walk-no {
  color: #9b938c;
}

.month-table .walk-empty {
  color: #d2cbc3;
}

.month-table .day-rate {
  min-width: 70px;
  font-size: 11px;
  font-weight: 800;
  color: #9b7c5e;
  background: #faf6f0;
}

.month-table .today-row td {
  background: #f8f0e6;
}

.month-table .today-row td:first-child {
  background: #eee0cf;
}

.month-table .today-row .walk-yes {
  background: #f3e5d3;
}

.month-table .future-row {
  opacity: .45;
}

.month-help {
  margin-top: 10px;
  color: #a0978e;
  font-size: 11px;
  text-align: center;
}

/* STATISTICS */

.stats-summary {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin-bottom: 15px;
}

.summary-box {
  background: #fffdf9;
  border-radius: 19px;
  padding: 17px;
  box-shadow: 0 4px 15px rgba(70,50,30,.05);
}

.summary-label {
  color: #a0978e;
  font-size: 11px;
}

.summary-value {
  font-size: 24px;
  font-weight: 850;
  margin-top: 4px;
}

.stat-list {
  display: grid;
  gap: 9px;
}

.stat-card {
  background: #fffdf9;
  border-radius: 18px;
  padding: 15px;
}

.stat-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.stat-name {
  font-size: 15px;
  font-weight: 850;
}

.stat-count {
  font-size: 14px;
  font-weight: 800;
  color: #9b7c5e;
}

.progress {
  height: 7px;
  background: #eee8df;
  border-radius: 10px;
  margin-top: 10px;
  overflow: hidden;
}

.progress-bar {
  height: 100%;
  background: #b79a78;
  border-radius: 10px;
  transition: width .3s;
}

.stat-bottom {
  display: flex;
  justify-content: space-between;
  margin-top: 6px;
  color: #aaa098;
  font-size: 10px;
}

/* LOADING */

.loading {
  text-align: center;
  padding: 35px;
  color: #999087;
}

.error {
  display: none;
  background: #f1dddd;
  color: #875d5d;
  padding: 13px;
  border-radius: 15px;
  font-size: 12px;
  margin-bottom: 14px;
}

.bottom-info {
  margin-top: 22px;
  padding: 16px;
  background: #eee7de;
  border-radius: 16px;
  text-align: center;
  font-size: 11px;
  color: #8d8277;
  line-height: 1.6;
}

.hidden {
  display: none;
}

@media (max-width: 480px) {

  .app {
    padding: 20px 13px 40px;
  }

  h1 {
    font-size: 25px;
  }

  .dog-card {
    padding: 13px;
  }

  .walk-btn {
    width: 41px;
  }

  .month-table {
    min-width: 950px;
  }

}
</style>
</head>

<body>

<div class="app">

  <div class="header">

    <div class="eyebrow">
      🐾 DAILY DOG WALK
    </div>

    <h1>
      우리집 댕댕이 산책일지
    </h1>

    <div class="subtitle">
      우리 아이들의 산책을 함께 기록해요
    </div>

  </div>


  <div class="nav">

    <button
      id="navToday"
      class="active"
      onclick="showPage('today')">
      🐾 오늘
    </button>

    <button
      id="navMonth"
      onclick="showPage('month')">
      📅 이번 달
    </button>

    <button
      id="navStats"
      onclick="showPage('stats')">
      📊 통계
    </button>

  </div>


  <div id="error" class="error"></div>


  <!-- ===================== -->
  <!-- 오늘 -->
  <!-- ===================== -->

  <section id="pageToday">

    <div class="date-card card">

      <div>

        <div class="date-label">
          TODAY
        </div>

        <div
          class="today"
          id="today">
        </div>

      </div>

      <div class="rate">

        <div
          class="rate-number"
          id="todayRate">
          0%
        </div>

        <div class="rate-label">
          오늘 산책률
        </div>

      </div>

    </div>


    <div class="section-title">
      🐶 오늘의 산책 체크
    </div>


    <div
      id="dogList"
      class="dog-list">

      <div class="loading">
        기록을 불러오는 중...
      </div>

    </div>

  </section>


  <!-- ===================== -->
  <!-- 이번 달 -->
  <!-- ===================== -->

  <section
    id="pageMonth"
    class="hidden">

    <div class="month-header card">

      <div
        class="month-title"
        id="monthTitle">
      </div>

      <div
        class="month-summary"
        id="monthSummary">
        이번 달 산책 기록
      </div>

    </div>


    <div
      id="calendar"
      class="calendar">

      <div class="loading">
        불러오는 중...
      </div>

    </div>


    <div class="month-help">
      💡 ○ / × 를 누르면 산책 기록을 바로 수정할 수 있어요
    </div>

  </section>


  <!-- ===================== -->
  <!-- 통계 -->
  <!-- ===================== -->

  <section
    id="pageStats"
    class="hidden">

    <div class="stats-summary">

      <div class="summary-box">

        <div class="summary-label">
          이번 달 총 산책
        </div>

        <div
          class="summary-value"
          id="totalWalks">
          0
        </div>

      </div>


      <div class="summary-box">

        <div class="summary-label">
          전체 평균 산책률
        </div>

        <div
          class="summary-value"
          id="averageRate">
          0%
        </div>

      </div>

    </div>


    <div class="section-title">
      🐕 강아지별 산책 기록
    </div>


    <div
      id="statList"
      class="stat-list">

      <div class="loading">
        통계를 계산하는 중...
      </div>

    </div>

  </section>


  <div class="bottom-info">

    ○ 산책 완료 &nbsp;&nbsp; × 오늘은 못 갔어요<br>

    기록은 함께 사용하는 산책일지에 저장됩니다.

  </div>

</div>


<script>

/* =====================================
   Google Apps Script
===================================== */

const API =
"https://script.google.com/macros/s/AKfycbwXn6-HoEyTpKpA0p91VXeLAh9FbVIMnzpWLJj4_3N0RJJVTAoWsOE5KEBZuEBi52haJA/exec";


/* =====================================
   강아지 목록
===================================== */

const dogs = [
  "짜장",
  "카오",
  "두꽃",
  "완두",
  "보보",
  "송",
  "빈",
  "채채",
  "양파",
  "무지",
  "타오",
  "카노",
  "로랑"
];


let records = [];


/* =====================================
   날짜
===================================== */

function getToday() {

  const d = new Date();

  return (
    d.getFullYear() +
    "-" +
    String(d.getMonth() + 1).padStart(2,"0") +
    "-" +
    String(d.getDate()).padStart(2,"0")
  );

}


const today = getToday();

const currentYear =
  Number(today.substring(0,4));

const currentMonth =
  Number(today.substring(5,7));


document.getElementById("today").textContent =
  today.replaceAll("-", ". ");


/* =====================================
   데이터 불러오기
===================================== */

async function loadData() {

  try {

    const response =
      await fetch(API);

    records =
      await response.json();

    drawToday();
    drawMonth();
    drawStats();

  } catch(error) {

    console.error(error);

    document.getElementById("error").style.display =
      "block";

    document.getElementById("error").textContent =
      "기록을 불러오지 못했어요.";

    drawToday();
    drawMonth();
    drawStats();

  }

}


/* =====================================
   특정 기록 찾기
===================================== */

function getStatus(date,dog) {

  const found =
    records.find(function(item) {

      return (
        item.date === date &&
        item.dog === dog
      );

    });

  return found
    ? found.status
    : "";

}


/* =====================================
   오늘 화면
===================================== */

function drawToday() {

  const list =
    document.getElementById("dogList");

  list.innerHTML = "";


  dogs.forEach(function(dog) {

    const status =
      getStatus(today,dog);


    const card =
      document.createElement("div");

    card.className =
      "dog-card";


    card.innerHTML = `

      <div>

        <div class="dog-name">
          ${dog}
        </div>

        <div class="status">

          ${
            status === "y"
            ? "오늘 산책 완료 🐾"
            : status === "n"
            ? "오늘은 쉬는 날"
            : "아직 기록하지 않았어요"
          }

        </div>

      </div>


      <div class="buttons">

        <button
          class="walk-btn ${
            status === "y"
            ? "active-yes"
            : ""
          }"
          onclick="saveWalk('${dog}','y')">
          ○
        </button>

        <button
          class="walk-btn ${
            status === "n"
            ? "active-no"
            : ""
          }"
          onclick="saveWalk('${dog}','n')">
          ×
        </button>

      </div>

    `;


    list.appendChild(card);

  });


  updateTodayRate();

}


/* =====================================
   오늘 산책률
===================================== */

function updateTodayRate() {

  let done = 0;


  dogs.forEach(function(dog) {

    if(
      getStatus(today,dog) === "y"
    ) {

      done++;

    }

  });


  const percent =
    Math.round(
      (done / dogs.length) * 100
    );


  document.getElementById("todayRate").textContent =
    percent + "%";

}


/* =====================================
   저장
===================================== */

async function saveWalk(dog,status,dateValue) {

  const saveDate =
    dateValue || today;


  const url =
    API +
    "?date=" +
    encodeURIComponent(saveDate) +
    "&dog=" +
    encodeURIComponent(dog) +
    "&status=" +
    encodeURIComponent(status);


  try {

    await fetch(url);


    const existing =
      records.find(function(item) {

        return (
          item.date === saveDate &&
          item.dog === dog
        );

      });


    if(existing) {

      existing.status =
        status;

    } else {

      records.push({

        date: saveDate,
        dog: dog,
        status: status

      });

    }


    drawToday();
    drawMonth();
    drawStats();

  } catch(error) {

    alert("저장에 실패했어요.");

  }

}


/* =====================================
   이번 달 표
===================================== */

function drawMonth() {

  const calendar =
    document.getElementById("calendar");

  calendar.innerHTML = "";


  const monthText =
    currentYear +
    "년 " +
    currentMonth +
    "월";


  document.getElementById("monthTitle").textContent =
    monthText;


  const daysInMonth =
    new Date(
      currentYear,
      currentMonth,
      0
    ).getDate();


  let totalDone = 0;
  let totalPossible = 0;


  const tableWrap =
    document.createElement("div");

  tableWrap.className =
    "month-table-wrap";


  const table =
    document.createElement("table");

  table.className =
    "month-table";


  /* 헤더 */

  const thead =
    document.createElement("thead");

  const headerRow =
    document.createElement("tr");


  let headerHTML =
    "<th>날짜</th>";


  dogs.forEach(function(dog) {

    headerHTML +=
      `<th class="dog-head">${dog}</th>`;

  });


  headerHTML +=
    "<th>산책률</th>";


  headerRow.innerHTML =
    headerHTML;

  thead.appendChild(headerRow);

  table.appendChild(thead);


  /* 본문 */

  const tbody =
    document.createElement("tbody");


  for(
    let day = 1;
    day <= daysInMonth;
    day++
  ) {

    const date =
      currentYear +
      "-" +
      String(currentMonth).padStart(2,"0") +
      "-" +
      String(day).padStart(2,"0");


    const isFuture =
      date > today;


    let done = 0;


    dogs.forEach(function(dog) {

      if(
        getStatus(date,dog) === "y"
      ) {

        done++;

      }

    });


    if(!isFuture) {

      totalDone += done;

      totalPossible +=
        dogs.length;

    }


    const percent =
      isFuture
      ? "-"
      : Math.round(
          (done / dogs.length) * 100
        ) + "%";


    const row =
      document.createElement("tr");


    if(date === today) {

      row.classList.add(
        "today-row"
      );

    }


    if(isFuture) {

      row.classList.add(
        "future-row"
      );

    }


    let rowHTML =
      `<td class="date-cell">
        ${currentMonth}/${day}
      </td>`;


    dogs.forEach(function(dog) {

      const status =
        getStatus(date,dog);


      let symbol = "·";

      let className =
        "walk-cell walk-empty";


      if(status === "y") {

        symbol = "○";

        className =
          "walk-cell walk-yes";

      }


      if(status === "n") {

        symbol = "×";

        className =
          "walk-cell walk-no";

      }


      if(isFuture) {

        rowHTML +=
          `<td class="${className}">${symbol}</td>`;

      } else {

        rowHTML +=
          `<td
            class="${className}"
            onclick="saveWalk('${dog}', '${status === "y" ? "n" : "y"}', '${date}')">
            ${symbol}
          </td>`;

      }

    });


    rowHTML +=
      `<td class="day-rate">
        ${percent}
      </td>`;


    row.innerHTML =
      rowHTML;


    tbody.appendChild(row);

  }


  table.appendChild(tbody);

  tableWrap.appendChild(table);

  calendar.appendChild(tableWrap);


  const monthRate =
    totalPossible === 0
    ? 0
    : Math.round(
        (totalDone / totalPossible) * 100
      );


  document.getElementById("monthSummary").textContent =
    "이번 달 전체 산책률 " +
    monthRate +
    "% · ○ / × 를 눌러 기록 수정";


}


/* =====================================
   통계
===================================== */

function drawStats() {

  const list =
    document.getElementById("statList");

  list.innerHTML = "";


  let totalWalks = 0;


  const stats =
    dogs.map(function(dog) {

      let count = 0;


      records.forEach(function(item) {

        if(
          item.dog === dog &&
          item.status === "y" &&
          item.date &&
          item.date.substring(0,7) ===
          today.substring(0,7)
        ) {

          count++;

        }

      });


      totalWalks += count;


      const elapsedDays =
        Number(
          today.substring(8,10)
        );


      const rate =
        elapsedDays === 0
        ? 0
        : Math.round(
            (count / elapsedDays) * 100
          );


      return {

        dog: dog,
        count: count,
        rate: Math.min(
          rate,
          100
        )

      };

    });


  stats.sort(function(a,b) {

    return b.count - a.count;

  });


  stats.forEach(function(stat) {

    const card =
      document.createElement("div");

    card.className =
      "stat-card";


    card.innerHTML = `

      <div class="stat-top">

        <div class="stat-name">
          ${stat.dog}
        </div>

        <div class="stat-count">
          ${stat.count}회
        </div>

      </div>


      <div class="progress">

        <div
          class="progress-bar"
          style="width:${stat.rate}%">
        </div>

      </div>


      <div class="stat-bottom">

        <span>
          이번 달 산책
        </span>

        <span>
          ${stat.rate}%
        </span>

      </div>

    `;


    list.appendChild(card);

  });


  document.getElementById("totalWalks").textContent =
    totalWalks + "회";


  const elapsedDays =
    Number(
      today.substring(8,10)
    );


  const average =
    dogs.length === 0
    ? 0
    : Math.round(
        totalWalks /
        (dogs.length * elapsedDays) *
        100
      );


  document.getElementById("averageRate").textContent =
    Math.min(
      average,
      100
    ) + "%";

}


/* =====================================
   페이지 전환
===================================== */

function showPage(page) {

  document.getElementById("pageToday")
    .classList.add("hidden");

  document.getElementById("pageMonth")
    .classList.add("hidden");

  document.getElementById("pageStats")
    .classList.add("hidden");


  document.getElementById("navToday")
    .classList.remove("active");

  document.getElementById("navMonth")
    .classList.remove("active");

  document.getElementById("navStats")
    .classList.remove("active");


  if(page === "today") {

    document.getElementById("pageToday")
      .classList.remove("hidden");

    document.getElementById("navToday")
      .classList.add("active");

  }


  if(page === "month") {

    document.getElementById("pageMonth")
      .classList.remove("hidden");

    document.getElementById("navMonth")
      .classList.add("active");

    drawMonth();

  }


  if(page === "stats") {

    document.getElementById("pageStats")
      .classList.remove("hidden");

    document.getElementById("navStats")
      .classList.add("active");

    drawStats();

  }

}


/* =====================================

loadData();

</script>
